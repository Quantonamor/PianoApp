name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (OMR, pitch detection, importers, practice engine)
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          echo "==== COMPILER ERRORS ===="
          grep -E "^e: |What went wrong" -A2 build.log | head -150 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PianoTiles-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests on emulator (phone, landscape)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell settings put system font_scale 1.3
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.notClass=de.pianotiles.app.HandsShotTest || (timeout 60 adb pull /sdcard/Android/data/de.pianotiles.app/files/screenshots screenshots; timeout 60 adb logcat -d | grep -E "AndroidRuntime|FATAL|ANR|Fatal signal" | tail -60; echo "==== FAILED TESTS ===="; find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -A14 "<failure" {} + | head -80; exit 1)
            timeout 60 adb pull /sdcard/Android/data/de.pianotiles.app/files/screenshots screenshots || true
            # the 3D hands separately: the emulator's software renderer has crashed on them before, which must not hide the results above
            timeout 600 ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=de.pianotiles.app.HandsShotTest || echo "==== HANDS TEST FAILED (not blocking) ===="
            timeout 60 adb pull /sdcard/Android/data/de.pianotiles.app/files/screenshots screenshots || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
      - name: Layout report and a few small screenshots in the log (readable without artifact download)
        if: always()
        shell: bash
        run: |
          [ -d screenshots ] || exit 0
          echo "==== LAYOUT ===="; cat screenshots/layout.txt || true; echo "==== END LAYOUT ===="
          [ -f screenshots/threads.txt ] && { echo "==== THREADS ===="; cat screenshots/threads.txt; echo "==== END THREADS ===="; } || true
          # the most important screens come last: the end of the log is what can be fetched cheaply
          key="08c_hands_landscape 08b_hands_playing 07_editor 01_library 01b_library_landscape 03e_landscape_paused 03d_landscape_playing 04_wait_mode 03_practice_playing"
          for f in screenshots/*.small.jpg; do
            n=$(basename "$f" .small.jpg); case " $key " in *" $n "*) continue;; esac
            echo "==== SHOT $n ===="; base64 -w 0 "$f"; echo
          done
          for n in $key; do
            [ -f "screenshots/$n.small.jpg" ] || continue
            echo "==== SHOT $n ===="; base64 -w 0 "screenshots/$n.small.jpg"; echo
          done
      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/
